name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install ruff coverage

      - name: Lint with ruff
        run: ruff check .

      - name: Run Django checks
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          DJANGO_DEBUG: 'True'
          DJANGO_ALLOWED_HOSTS: '*'
        run: python manage.py check

      - name: Run tests with coverage
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          DJANGO_DEBUG: 'True'
          DJANGO_ALLOWED_HOSTS: '*'
        run: |
          coverage run --source='.' manage.py test comercial contabilidad facturacion nomina legal core_erp comunicacion reportes operaciones cumplimiento indicadores
          coverage report --skip-covered

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pip-audit semgrep

      # Chequeo de seguridad de despliegue de Django (DEBUG, cookies seguras,
      # HSTS, SSL redirect, etc.). Se ejecuta con DEBUG=False para validar la
      # configuración real de producción.
      - name: Django deployment security check
        env:
          DJANGO_SECRET_KEY: 'ci-security-check-secret-key-only-not-for-production-use-0123456789'
          DJANGO_DEBUG: 'False'
          DJANGO_ALLOWED_HOSTS: 'erp.quintakooxtanil.com'
          CLOUDFLARE_R2_PRIVADO_BUCKET: ci-dummy
        run: python manage.py check --deploy --fail-level WARNING

      # Auditoría de dependencias con vulnerabilidades conocidas (CVE/PYSEC).
      # Bloqueante. Si aparece un aviso sin parche, ignorarlo con
      # --ignore-vuln <ID> y un comentario que lo justifique.
      - name: Audit dependencies (pip-audit)
        run: pip-audit -r requirements.lock --desc

      # Detección de secretos commiteados (API keys, tokens, credenciales).
      # Se instala el binario directo desde el release oficial (no la
      # GitHub Action de gitleaks, que requiere licencia en repos privados)
      # y se verifica su checksum contra el que publica el propio release.
      # --no-git escanea el árbol de trabajo tal como quedó el checkout, no
      # el historial completo (eso es la auditoría puntual de la orden 33).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
          curl -sSL -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "${ARCHIVE}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets (gitleaks)
        run: gitleaks detect --no-git --source . --redact -v

      # Análisis estático (SAST) más allá de lo que cubre ruff/S (bandit).
      # Informativo por ahora: igual que pip-audit, no bloquea el pipeline
      # hasta que se triage el primer barrido completo de hallazgos, mismo
      # criterio ya aplicado a la orden 31 (ruleset S de ruff) antes de
      # activarlo como gate real.
      - name: Static analysis (semgrep)
        run: semgrep scan --config auto --error .
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t erp-qkt:ci .

      # Si WeasyPrint y Django arrancan dentro de la imagen en CI, arrancan en Railway.
      - name: Smoke test (PDF + check)
        run: |
          docker run --rm -e DJANGO_SECRET_KEY=ci-docker-smoke-not-for-production \
            -e DJANGO_DEBUG=True -e DJANGO_ALLOWED_HOSTS='*' erp-qkt:ci \
            sh -c "python -c \"import weasyprint; weasyprint.HTML(string='<p>ok</p>').write_pdf()\" && python manage.py check"

      # Solo CVE de HIGH/CRITICAL con parche disponible; excepciones en .trivyignore.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: erp-qkt:ci
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Scan filesystem (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore
