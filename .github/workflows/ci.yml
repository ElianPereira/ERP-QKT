name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff coverage

      - name: Lint with ruff
        run: ruff check .

      - name: Run Django checks
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DEBUG: 'True'
          ALLOWED_HOSTS: '*'
        run: python manage.py check

      - name: Run tests with coverage
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DEBUG: 'True'
          ALLOWED_HOSTS: '*'
        run: |
          coverage run --source='.' manage.py test comercial contabilidad airbnb facturacion nomina legal core_erp comunicacion reportes
          coverage report --skip-covered

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      # Chequeo de seguridad de despliegue de Django (DEBUG, cookies seguras,
      # HSTS, SSL redirect, etc.). Se ejecuta con DEBUG=False para validar la
      # configuración real de producción.
      - name: Django deployment security check
        env:
          SECRET_KEY: 'ci-security-check-secret-key-only-not-for-production-use-0123456789'
          DEBUG: 'False'
          ALLOWED_HOSTS: 'erp.quintakooxtanil.com'
        run: python manage.py check --deploy --fail-level WARNING

      # Auditoría de dependencias con vulnerabilidades conocidas (CVE/PYSEC).
      # Informativo: no bloquea el pipeline para no frenar merges por avisos
      # transitivos, pero deja el reporte visible en los logs de CI.
      - name: Audit dependencies (pip-audit)
        run: pip-audit -r requirements.txt --desc
        continue-on-error: true

      # Detección de secretos commiteados (API keys, tokens, credenciales).
      # Se instala el binario directo desde el release oficial (no la
      # GitHub Action de gitleaks, que requiere licencia en repos privados)
      # y se verifica su checksum contra el que publica el propio release.
      # --no-git escanea el árbol de trabajo tal como quedó el checkout, no
      # el historial completo (eso es la auditoría puntual de la orden 33).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
          curl -sSL -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "${ARCHIVE}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets (gitleaks)
        run: gitleaks detect --no-git --source . --redact -v
