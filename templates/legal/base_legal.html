<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}{% endblock %} — Quinta Ko'ox Tanil</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'IBM Plex Sans', sans-serif; background: #f5f3ef; color: #2c2b28; line-height: 1.7; }
        .barra { background: #F5C518; padding: 16px 5%; display: flex; align-items: center; gap: 14px; }
        .barra img { height: 42px; width: auto; }
        .barra a { color: #2c2b28; text-decoration: none; font-weight: 700; font-size: 15px; }
        .contenedor { max-width: 820px; margin: 0 auto; padding: 32px 20px 60px; }
        .doc { background: #fff; border-radius: 14px; padding: 36px 34px; box-shadow: 0 4px 20px rgba(0,0,0,.06); }
        h1 { font-size: 26px; margin-bottom: 6px; color: #2E7D32; }
        .actualizado { font-size: 12px; color: #8a8780; margin-bottom: 26px; }
        h2 { font-size: 17px; margin: 26px 0 8px; color: #2c2b28; }
        p, li { font-size: 14.5px; color: #4a4842; }
        ul, ol { margin: 8px 0 8px 22px; }
        li { margin-bottom: 5px; }
        .datos { background: #f8f8f6; border: 1px solid #ece9e2; border-radius: 10px; padding: 16px 18px; margin: 14px 0; font-size: 14px; }
        .datos strong { color: #2c2b28; }
        .destacado { background: #E8F5E9; border-left: 4px solid #2E7D32; border-radius: 8px; padding: 14px 16px; margin: 16px 0; font-size: 14.5px; }
        a { color: #2E7D32; }
        .volver { display: inline-block; margin-top: 26px; font-size: 14px; font-weight: 600; text-decoration: none; }
        footer { text-align: center; padding: 26px 20px 40px; font-size: 12.5px; color: #8a8780; }
        footer a { color: #2E7D32; text-decoration: none; font-weight: 600; margin: 0 8px; }
        @media (max-width: 600px) { .doc { padding: 26px 20px; } h1 { font-size: 22px; } }
    </style>
</head>
<body>
    <div class="barra">
        <a href="/"><img src="/static/img/logo.png" alt="Quinta Ko'ox Tanil"></a>
        <a href="/">Quinta Ko'ox Tanil</a>
    </div>

    <div class="contenedor">
        <div class="doc">
            {% block contenido %}{% endblock %}
            <a href="/" class="volver">← Volver al inicio</a>
        </div>
    </div>

    <footer>
        <a href="{% url 'aviso_privacidad' %}">Aviso de Privacidad</a>·<a href="{% url 'terminos_condiciones' %}">Términos y Condiciones</a>
        <div style="margin-top:8px;">© Quinta Ko'ox Tanil · Umán, Yucatán · México</div>
    </footer>
</body>
</html>
