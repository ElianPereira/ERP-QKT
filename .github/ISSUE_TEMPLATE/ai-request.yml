name: Solicitud de IA
description: Elige un modo y describe brevemente lo que necesitas.
title: "[AI]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        El modo combinado puede fusionar automáticamente. Los modos individuales crean un PR para revisión manual.
        No incluyas secretos, datos personales ni instrucciones de producción.
  - type: dropdown
    id: mode
    attributes:
      label: Modo
      options:
        - Combinado
        - Solo Codex
        - Solo Claude
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objetivo
      description: ¿Qué quieres lograr?
      placeholder: Quiero que...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
      description: ¿Cómo sabremos que quedó bien?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Detalles o límites
      description: Opcional. Indica restricciones o información útil.
    validations:
      required: false
  - type: checkboxes
    id: authorization
    attributes:
      label: Autorización
      options:
        - label: Autorizo ejecutar el modo seleccionado y consumir las APIs necesarias. Entiendo que solo el modo combinado puede fusionarse automáticamente.
          required: true

