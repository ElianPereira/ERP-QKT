name: AI Implement

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: ai-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    name: Plan, implement and open PR
    permissions:
      contents: read # checkout and repository context
      issues: write # publish the plan and PR link
      pull-requests: read # let Claude inspect linked PR metadata
      id-token: write # required by anthropics/claude-code-action to fetch its OIDC token
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[AI]:')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate request and select mode
        id: request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          mode_label=$(awk '
            /^### Modo$/ { found=1; next }
            found && NF { print; exit }
          ' <<<"$ISSUE_BODY")
          case "$mode_label" in
            "Combinado") mode="combined" ;;
            "Solo Codex") mode="codex" ;;
            "Solo Claude") mode="claude" ;;
            *) echo "Modo ausente o inválido: $mode_label" >&2; exit 1 ;;
          esac
          grep -Eq '^- \[[xX]\] Autorizo ejecutar el modo seleccionado y consumir las APIs necesarias\.' <<<"$ISSUE_BODY" || {
            echo "La solicitud no contiene la autorización obligatoria." >&2
            exit 1
          }
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "mode-label=$mode_label" >> "$GITHUB_OUTPUT"

          # Los Issues que salen del skill `solicitud-ai` ya traen un plan
          # ejecutable escrito a mano en "Detalles o límites". Volver a
          # planificarlos con Claude es trabajo duplicado y, además, era el
          # único paso capaz de tumbar el job entero por agotar turnos.
          # Se detecta por sus encabezados característicos.
          if grep -Eq '^#{3,6} *(Alcance incluido|Plan de implementación|Criterios de aceptación)' <<<"$ISSUE_BODY"; then
            echo "has-plan=true" >> "$GITHUB_OUTPUT"
            echo "El Issue ya trae plan propio: se omite la fase de planeación." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has-plan=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan with Claude
        if: >-
          steps.request.outputs.mode == 'combined' &&
          steps.request.outputs.has-plan != 'true'
        id: plan
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Actúa exclusivamente como arquitecto y planificador para el Issue
            #${{ github.event.issue.number }} de ${{ github.repository }}.

            TÍTULO:
            ${{ github.event.issue.title }}

            SOLICITUD:
            ${{ github.event.issue.body }}

            Lee CLAUDE.md, AGENTS.md y PROJECT_CONTEXT.md. Investiga el código
            relacionado sin modificar archivos. Devuelve un plan ejecutable por
            Codex, con alcance, exclusiones, archivos relevantes, pasos, criterios
            de aceptación, validaciones reales y riesgos. Marca blocked=true si
            falta una decisión humana, la petición es insegura o no puede
            planificarse con evidencia suficiente.

            HERRAMIENTAS: en este paso solo tienes Read, Grep, Glob y TodoWrite.
            Cualquier otra (Bash, Write, Edit, WebFetch, Task…) está denegada y
            cada intento gasta un turno sin devolver nada. No las intentes: lo
            que harías con `bash ls` hazlo con Glob, y lo que harías con
            `bash grep`/`git log` hazlo con Grep sobre los archivos. Presupuesto
            de turnos limitado — si te acercas al límite, devuelve el mejor plan
            que tengas con lo investigado en vez de seguir explorando; un plan
            parcial es útil y quedarte sin turnos no devuelve nada.
          # Historial de este límite, para no volver a bajarlo a ciegas:
          #   Issue #165 → 12 turnos, solo Read/Grep/Glob: error_max_turns a los
          #     13 turnos con 5 denegaciones. Se subió a 25 y se añadió TodoWrite.
          #   Issue #173 → 25 turnos: error_max_turns a los 26 con **11**
          #     denegaciones, o sea ~15 turnos útiles para planificar un cambio
          #     de admin + plantillas + pruebas. Sin plan, el job muere con
          #     "Claude did not return structured_output" y el Issue se queda
          #     sin PR y sin explicación.
          # De ahí las dos medidas: 45 turnos, y la lista de herramientas
          # explícita en el prompt para que las denegaciones dejen de comerse
          # casi la mitad del presupuesto. TodoWrite no escribe en el
          # repositorio — solo lleva la lista de pasos del propio agente.
          claude_args: >-
            --max-turns 45
            --allowedTools "Read,Grep,Glob,TodoWrite"
            --json-schema '{"type":"object","properties":{"blocked":{"type":"boolean"},"blocker":{"type":"string"},"plan":{"type":"string"}},"required":["blocked","blocker","plan"],"additionalProperties":false}'

      # Qué herramientas intentó usar el planificador y cuántas veces. El log
      # de la acción oculta el detalle de la conversación a propósito, así que
      # cuando el paso muere por agotar turnos no hay forma de saber en qué se
      # fueron: en #165 fueron 5 denegaciones de 13 turnos y en #173 once de
      # 26, y las dos veces hubo que adivinar cuál era la herramienta. Aquí
      # solo se extraen NOMBRES de herramientas y conteos — nunca los inputs,
      # el prompt ni la respuesta — y cualquiera que no esté en --allowedTools
      # es, por definición, una denegación.
      - name: Report planner tool usage
        if: >-
          always() &&
          (steps.plan.outcome == 'success' || steps.plan.outcome == 'failure')
        run: |
          log=/home/runner/work/_temp/claude-execution-output.json
          test -f "$log" || { echo "No se generó log de ejecución del planificador." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          {
            echo "### Herramientas intentadas por el planificador"
            echo
            echo "| Herramienta | Intentos |"
            echo "| --- | --- |"
            jq -r '[.. | objects | select(.type? == "tool_use") | .name]
                   | group_by(.)
                   | sort_by(-length)
                   | map("| \(.[0]) | \(length) |")
                   | .[]' "$log" 2>/dev/null \
              || echo "| (no se pudo parsear el log) | - |"
            echo
            echo "Permitidas: \`Read\`, \`Grep\`, \`Glob\`, \`TodoWrite\`. Cualquier otra de la tabla fue denegada y consumió un turno sin devolver nada."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Claude plan
        if: >-
          steps.request.outputs.mode == 'combined' &&
          steps.request.outputs.has-plan != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PLAN_JSON: ${{ steps.plan.outputs.structured_output }}
        run: |
          plan=$(jq -r '.plan' <<<"$PLAN_JSON")
          blocked=$(jq -r '.blocked' <<<"$PLAN_JSON")
          blocker=$(jq -r '.blocker' <<<"$PLAN_JSON")
          {
            echo "## Plan automático de Claude"
            echo
            echo "$plan"
            if [ "$blocked" = "true" ]; then
              echo
              echo "### Bloqueo"
              echo "$blocker"
            fi
          } > /tmp/claude-plan.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/claude-plan.md

      - name: Stop on planning blocker
        if: >-
          steps.request.outputs.mode == 'combined' &&
          fromJSON(steps.plan.outputs.structured_output || '{}').blocked == true
        env:
          # steps.plan se salta por completo en modo Codex/Claude, así que su
          # output queda vacío: sin el `|| '{}'` aquí y en el `if:` de arriba,
          # fromJSON('') revienta la compilación del template para TODO el
          # job (no solo este step) con "The template is not valid", incluso
          # en modos que nunca llegan a ejecutar este paso.
          BLOCKER: ${{ fromJSON(steps.plan.outputs.structured_output || '{}').blocker }}
        run: |
          echo "Claude bloqueó la implementación: $BLOCKER" >&2
          exit 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff coverage

      - name: Implement combined request with Codex
        if: steps.request.outputs.mode == 'combined'
        id: codex-combined
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          effort: medium
          prompt: |
            Implementa el Issue #${{ github.event.issue.number }} en
            ${{ github.repository }} siguiendo AGENTS.md, CLAUDE.md y PROJECT_CONTEXT.md.

            SOLICITUD ORIGINAL:
            ${{ github.event.issue.body }}

            PLAN A SEGUIR:
            ${{ steps.request.outputs.has-plan == 'true' && 'El plan ya viene dentro de la SOLICITUD ORIGINAL de arriba (sección "Detalles o límites"): alcance incluido y excluido, pasos, pruebas, criterios de aceptación y riesgos. Es el plan aprobado — síguelo tal cual y no lo reinterpretes. Si algo del plan resulta imposible o incorrecto al implementarlo, impleméntalo todo lo demás y decláralo explícitamente en el resumen final en vez de improvisar una alternativa.' || fromJSON(steps.plan.outputs.structured_output || '{}').plan }}

            Respeta la arquitectura Django, la lógica de negocio y las áreas sensibles.
            Modifica solo los archivos necesarios. No cambies workflows,
            instrucciones de agentes, credenciales ni la propia automatización.
            Ejecuta las validaciones aplicables. No hagas push ni merge.

      - name: Implement Codex-only request
        if: steps.request.outputs.mode == 'codex'
        id: codex-only
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          effort: medium
          prompt: |
            Analiza e implementa directamente el Issue
            #${{ github.event.issue.number }} en ${{ github.repository }} siguiendo
            AGENTS.md, CLAUDE.md y PROJECT_CONTEXT.md.

            SOLICITUD:
            ${{ github.event.issue.body }}

            Respeta la arquitectura Django, la lógica de negocio y las áreas sensibles.
            Define internamente un plan breve antes de editar. Modifica solo los
            archivos necesarios. No cambies workflows, instrucciones de agentes,
            credenciales ni la propia automatización. Ejecuta las validaciones
            aplicables. No hagas push ni merge. Este modo tendrá revisión y merge
            manuales.

      - name: Implement Claude-only request
        if: steps.request.outputs.mode == 'claude'
        id: claude-only
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Analiza e implementa directamente el Issue
            #${{ github.event.issue.number }} en ${{ github.repository }} siguiendo
            AGENTS.md, CLAUDE.md y PROJECT_CONTEXT.md.

            SOLICITUD:
            ${{ github.event.issue.body }}

            Respeta la arquitectura Django, la lógica de negocio y las áreas sensibles.
            Define un plan breve, modifica solo los archivos necesarios y ejecuta
            las validaciones aplicables. No cambies workflows, instrucciones de
            agentes, credenciales ni la propia automatización. No hagas push ni
            merge. Este modo tendrá revisión y merge manuales.
          claude_args: >-
            --max-turns 18
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(python:*),Bash(ruff:*)"

      - name: Enforce automation boundaries
        run: |
          test -n "$(git status --short)" || { echo "El agente no produjo cambios" >&2; exit 1; }
          changed=$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u )
          protected=$(printf '%s\n' "$changed" | grep -E \
            '^(\.github/(workflows|actions|ISSUE_TEMPLATE)/|\.claude/|\.gitmodules$|\.gitattributes$|AGENTS\.md$|CLAUDE\.md$|PROJECT_CONTEXT\.md$)' || true)
          test -z "$protected" || { echo "El agente modificó archivos protegidos:" >&2; echo "$protected" >&2; exit 1; }
          if printf '%s\n' "$changed" | grep -Eq '(^|/)\.env($|\.local$|\.production$|\.development$)'; then
            echo "El agente intentó confirmar un archivo de entorno real" >&2
            exit 1
          fi
          git diff --check

      - name: Validate implementation
        env:
          SECRET_KEY: local-ai-validation-key
          DEBUG: 'True'
          ALLOWED_HOSTS: '*'
        run: |
          ruff check . || echo "::warning::Ruff reportó deuda previa; el CI actual trata lint como informativo."
          python manage.py check
          python manage.py makemigrations --check --dry-run || echo "::warning::main ya contiene migraciones pendientes en facturacion/legal."
          coverage run --source='.' manage.py test comercial contabilidad airbnb facturacion nomina legal core_erp
          coverage report --skip-covered

      - name: Create scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AI_APP_CLIENT_ID }}
          private-key: ${{ secrets.AI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Create implementation branch
        id: publish
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MODE: ${{ steps.request.outputs.mode }}
        run: |
          test -n "$APP_TOKEN" || { echo "La GitHub App no entregó un token temporal" >&2; exit 1; }
          branch="ai/${MODE}/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git config user.name "Codex Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.hooksPath /dev/null
          git switch -c "$branch"
          git add --all
          git commit -m "ai: implement issue #${ISSUE_NUMBER}"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRANCH: ${{ steps.publish.outputs.branch }}
          MODE: ${{ steps.request.outputs.mode }}
          MODE_LABEL: ${{ steps.request.outputs.mode-label }}
        run: |
          if [ "$MODE" = "combined" ]; then
            result="Claude planificó, Codex implementó y Claude revisará. El merge será automático únicamente con CI verde y aprobación."
          elif [ "$MODE" = "codex" ]; then
            result="Codex analizó e implementó. La revisión y el merge son manuales."
          else
            result="Claude analizó e implementó. La revisión y el merge son manuales."
          fi
          cat > /tmp/pr-body.md <<EOF
          Closes #${ISSUE_NUMBER}

          **Modo:** ${MODE_LABEL}

          ${result}
          EOF
          pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "AI: implementa #${ISSUE_NUMBER}" --body-file /tmp/pr-body.md)
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "La implementación en modo ${MODE_LABEL} quedó lista: $pr_url"

      # Sin esto, un fallo del workflow solo se ve como una X roja en Actions:
      # el Issue se queda sin PR y sin una sola palabra que lo explique. Así
      # pasó con #173, que se descubrió por casualidad días después.
      - name: Report failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        run: |
          {
            echo "## La automatización falló"
            echo
            echo "Este Issue **no tiene PR**: el workflow \`AI Implement\` terminó en error."
            echo
            if [ "$PLAN_OUTCOME" = "failure" ]; then
              echo "Falló en la fase de planeación. La causa habitual es agotar el"
              echo "presupuesto de turnos (\`error_max_turns\`): sin plan estructurado"
              echo "el job no puede continuar."
            fi
            echo
            echo "Detalle del run: $RUN_URL"
            echo
            echo "Vuelve a lanzarlo desde Actions o implementa el Issue a mano."
          } > /tmp/ai-failure.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/ai-failure.md

