{% extends "admin/base_site.html" %}
{% block content %}
<div class="qkt-pagina qkt-pagina--angosta">
    <div class="qkt-pagina__cabecera">
        <h1 class="qkt-pagina__titulo"><i class="fas fa-file-excel" aria-hidden="true"></i> Cargar Excel de asistencia</h1>
    </div>

    <form method="post" enctype="multipart/form-data" class="qkt-panel">
        <div class="qkt-panel__cuerpo">
            {% csrf_token %}
            <label class="qkt-zona-carga" for="id_excel">
                <i class="fas fa-cloud-upload-alt qkt-zona-carga__icono" aria-hidden="true"></i>
                <span class="qkt-zona-carga__titulo">Elige o arrastra aquí el archivo Excel</span>
                <span class="qkt-zona-carga__sub">.xlsx o .xls</span>
                <span class="qkt-zona-carga__conteo" aria-live="polite"></span>
                <input type="file" name="excel_file" id="id_excel" required accept=".xlsx, .xls">
            </label>

            <div class="qkt-botonera">
                <button type="submit" class="qkt-btn qkt-btn--primario">Procesar y generar recibos</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
