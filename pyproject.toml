[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "*/migrations/*",
    "venv",
    ".venv",
    "manage.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E402",  # module-level import not at top
    "F401",  # unused import (Django apps re-export)
    "F403",  # star imports
    "F405",  # may be undefined from star imports
    "E731",  # lambda assignments
    "E741",  # ambiguous variable name
    # S110 (try-except-pass): las 13 ocurrencias del repo son parseo/consulta
    # best-effort con fallback silencioso a un valor por defecto sensato
    # (disponibilidad, horarios, fechas, lookups opcionales) — el mismo
    # patrón ya revisado y aceptado en la orden 25/29 del backlog de
    # seguridad para los `except Exception:` genéricos. No esconden ningún
    # control de seguridad (auth/permisos); ver Memoria en CLAUDE.md.
    "S110",
]

[tool.ruff.lint.per-file-ignores]
# S105/S106/S107 (posible contraseña hardcodeada): en los archivos de tests
# son credenciales de prueba legítimas (create_user, tokens simulados,
# fixtures de webhook) — no secretos reales. Cualquier caso fuera de estos
# patrones sí debe bloquear el lint.
"**/tests.py" = ["S105", "S106", "S107"]
"**/test_*.py" = ["S105", "S106", "S107"]
"**/tests/*.py" = ["S105", "S106", "S107"]

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "manage.py",
    "venv/*",
]
