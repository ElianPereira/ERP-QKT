{% extends "registration/base.html" %}

{% block content %}
<div class="qkt-acceso__cabecera">
  <div class="qkt-acceso__icono"><i class="fas fa-mobile-alt"></i></div>
  <h1 class="qkt-acceso__titulo">Verifica tu identidad</h1>
  <p class="qkt-acceso__intro">Ingresa el código de 6 dígitos de tu app de autenticación.</p>
</div>

{% if messages %}
  {% for message in messages %}
    <div class="qkt-aviso qkt-aviso--error" role="alert">{{ message }}</div>
  {% endfor %}
{% endif %}

<form method="post" id="totp-form">
  {% csrf_token %}
  <input type="hidden" name="codigo" id="codigo">
  <div class="qkt-2fa__codigo">
    <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Dígito 1 del código" autofocus>
    <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 2 del código">
    <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 3 del código">
    <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 4 del código">
    <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 5 del código">
    <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 6 del código">
  </div>
  <button type="submit" class="qkt-btn qkt-btn--primario qkt-btn--bloque">Verificar</button>
</form>

<div class="qkt-acceso__enlace">
  <a href="{% url 'logout' %}">Cerrar sesión</a>
</div>

<script>
(function() {
  var boxes = document.querySelectorAll('.qkt-2fa__codigo input');
  var hidden = document.getElementById('codigo');

  function sync() {
    var valor = '';
    boxes.forEach(function(b) { valor += b.value; });
    hidden.value = valor;
  }

  boxes.forEach(function(box, i) {
    box.addEventListener('input', function() {
      box.value = box.value.replace(/[^0-9]/g, '');
      if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
      sync();
    });
    box.addEventListener('keydown', function(e) {
      if (e.key === 'Backspace' && !box.value && i > 0) boxes[i - 1].focus();
    });
    box.addEventListener('paste', function(e) {
      var texto = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
      if (!texto) return;
      e.preventDefault();
      for (var j = 0; j < boxes.length; j++) boxes[j].value = texto[j] || '';
      sync();
      boxes[Math.min(texto.length, boxes.length) - 1].focus();
    });
  });

  document.getElementById('totp-form').addEventListener('submit', sync);
})();
</script>
{% endblock %}
