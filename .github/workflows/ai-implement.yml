name: AI Implement

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: ai-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    name: Plan, implement and open PR
    permissions:
      contents: read # checkout and repository context
      issues: write # publish the plan and PR link
      pull-requests: read # let Claude inspect linked PR metadata
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[AI]:')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate request and select mode
        id: request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          mode_label=$(awk '
            /^### Modo$/ { found=1; next }
            found && NF { print; exit }
          ' <<<"$ISSUE_BODY")
          case "$mode_label" in
            "Combinado") mode="combined" ;;
            "Solo Codex") mode="codex" ;;
            "Solo Claude") mode="claude" ;;
            *) echo "Modo ausente o inválido: $mode_label" >&2; exit 1 ;;
          esac
          grep -Eq '^- \[[xX]\] Autorizo ejecutar el modo seleccionado y consumir las APIs necesarias\.' <<<"$ISSUE_BODY" || {
            echo "La solicitud no contiene la autorización obligatoria." >&2
            exit 1
          }
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "mode-label=$mode_label" >> "$GITHUB_OUTPUT"

      - name: Plan with Claude
        if: steps.request.outputs.mode == 'combined'
        id: plan
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Actúa exclusivamente como arquitecto y planificador para el Issue
            #${{ github.event.issue.number }} de ${{ github.repository }}.

            TÍTULO:
            ${{ github.event.issue.title }}

            SOLICITUD:
            ${{ github.event.issue.body }}

            Lee CLAUDE.md, AGENTS.md y PROJECT_CONTEXT.md. Investiga el código
            relacionado sin modificar archivos. Devuelve un plan ejecutable por
            Codex, con alcance, exclusiones, archivos relevantes, pasos, criterios
            de aceptación, validaciones reales y riesgos. Marca blocked=true si
            falta una decisión humana, la petición es insegura o no puede
            planificarse con evidencia suficiente.
          claude_args: >-
            --max-turns 12
            --allowedTools "Read,Grep,Glob"
            --json-schema '{"type":"object","properties":{"blocked":{"type":"boolean"},"blocker":{"type":"string"},"plan":{"type":"string"}},"required":["blocked","blocker","plan"],"additionalProperties":false}'

      - name: Publish Claude plan
        if: steps.request.outputs.mode == 'combined'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PLAN_JSON: ${{ steps.plan.outputs.structured_output }}
        run: |
          plan=$(jq -r '.plan' <<<"$PLAN_JSON")
          blocked=$(jq -r '.blocked' <<<"$PLAN_JSON")
          blocker=$(jq -r '.blocker' <<<"$PLAN_JSON")
          {
            echo "## Plan automático de Claude"
            echo
            echo "$plan"
            if [ "$blocked" = "true" ]; then
              echo
              echo "### Bloqueo"
              echo "$blocker"
            fi
          } > /tmp/claude-plan.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/claude-plan.md

      - name: Stop on planning blocker
        if: >-
          steps.request.outputs.mode == 'combined' &&
          fromJSON(steps.plan.outputs.structured_output).blocked == true
        env:
          BLOCKER: ${{ fromJSON(steps.plan.outputs.structured_output).blocker }}
        run: |
          echo "Claude bloqueó la implementación: $BLOCKER" >&2
          exit 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff coverage

      - name: Implement combined request with Codex
        if: steps.request.outputs.mode == 'combined'
        id: codex-combined
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          effort: medium
          prompt: |
            Implementa el Issue #${{ github.event.issue.number }} en
            ${{ github.repository }} siguiendo AGENTS.md, CLAUDE.md y PROJECT_CONTEXT.md.

            SOLICITUD ORIGINAL:
            ${{ github.event.issue.body }}

            PLAN VERIFICADO POR CLAUDE:
            ${{ fromJSON(steps.plan.outputs.structured_output).plan }}

            Respeta la arquitectura Django, la lógica de negocio y las áreas sensibles.
            Modifica solo los archivos necesarios. No cambies workflows,
            instrucciones de agentes, credenciales ni la propia automatización.
            Ejecuta las validaciones aplicables. No hagas push ni merge.

      - name: Implement Codex-only request
        if: steps.request.outputs.mode == 'codex'
        id: codex-only
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          effort: medium
          prompt: |
            Analiza e implementa directamente el Issue
            #${{ github.event.issue.number }} en ${{ github.repository }} siguiendo
            AGENTS.md, CLAUDE.md y PROJECT_CONTEXT.md.

            SOLICITUD:
            ${{ github.event.issue.body }}

            Respeta la arquitectura Django, la lógica de negocio y las áreas sensibles.
            Define internamente un plan breve antes de editar. Modifica solo los
            archivos necesarios. No cambies workflows, instrucciones de agentes,
            credenciales ni la propia automatización. Ejecuta las validaciones
            aplicables. No hagas push ni merge. Este modo tendrá revisión y merge
            manuales.

      - name: Implement Claude-only request
        if: steps.request.outputs.mode == 'claude'
        id: claude-only
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Analiza e implementa directamente el Issue
            #${{ github.event.issue.number }} en ${{ github.repository }} siguiendo
            AGENTS.md, CLAUDE.md y PROJECT_CONTEXT.md.

            SOLICITUD:
            ${{ github.event.issue.body }}

            Respeta la arquitectura Django, la lógica de negocio y las áreas sensibles.
            Define un plan breve, modifica solo los archivos necesarios y ejecuta
            las validaciones aplicables. No cambies workflows, instrucciones de
            agentes, credenciales ni la propia automatización. No hagas push ni
            merge. Este modo tendrá revisión y merge manuales.
          claude_args: >-
            --max-turns 18
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(python:*),Bash(ruff:*)"

      - name: Enforce automation boundaries
        run: |
          test -n "$(git status --short)" || { echo "El agente no produjo cambios" >&2; exit 1; }
          changed=$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u )
          protected=$(printf '%s\n' "$changed" | grep -E \
            '^(\.github/(workflows|actions|ISSUE_TEMPLATE)/|\.claude/|\.gitmodules$|\.gitattributes$|AGENTS\.md$|CLAUDE\.md$|PROJECT_CONTEXT\.md$)' || true)
          test -z "$protected" || { echo "El agente modificó archivos protegidos:" >&2; echo "$protected" >&2; exit 1; }
          if printf '%s\n' "$changed" | grep -Eq '(^|/)\.env($|\.local$|\.production$|\.development$)'; then
            echo "El agente intentó confirmar un archivo de entorno real" >&2
            exit 1
          fi
          git diff --check

      - name: Validate implementation
        env:
          SECRET_KEY: local-ai-validation-key
          DEBUG: 'True'
          ALLOWED_HOSTS: '*'
        run: |
          ruff check . || echo "::warning::Ruff reportó deuda previa; el CI actual trata lint como informativo."
          python manage.py check
          python manage.py makemigrations --check --dry-run || echo "::warning::main ya contiene migraciones pendientes en facturacion/legal."
          coverage run --source='.' manage.py test comercial contabilidad airbnb facturacion nomina legal core_erp
          coverage report --skip-covered

      - name: Create scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AI_APP_CLIENT_ID }}
          private-key: ${{ secrets.AI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Create implementation branch
        id: publish
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MODE: ${{ steps.request.outputs.mode }}
        run: |
          test -n "$APP_TOKEN" || { echo "La GitHub App no entregó un token temporal" >&2; exit 1; }
          branch="ai/${MODE}/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git config user.name "Codex Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.hooksPath /dev/null
          git switch -c "$branch"
          git add --all
          git commit -m "ai: implement issue #${ISSUE_NUMBER}"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRANCH: ${{ steps.publish.outputs.branch }}
          MODE: ${{ steps.request.outputs.mode }}
          MODE_LABEL: ${{ steps.request.outputs.mode-label }}
        run: |
          if [ "$MODE" = "combined" ]; then
            result="Claude planificó, Codex implementó y Claude revisará. El merge será automático únicamente con CI verde y aprobación."
          elif [ "$MODE" = "codex" ]; then
            result="Codex analizó e implementó. La revisión y el merge son manuales."
          else
            result="Claude analizó e implementó. La revisión y el merge son manuales."
          fi
          cat > /tmp/pr-body.md <<EOF
          Closes #${ISSUE_NUMBER}

          **Modo:** ${MODE_LABEL}

          ${result}
          EOF
          pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "AI: implementa #${ISSUE_NUMBER}" --body-file /tmp/pr-body.md)
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "La implementación en modo ${MODE_LABEL} quedó lista: $pr_url"

