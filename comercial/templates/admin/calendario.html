{% extends "admin/base_site.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/es.js"></script>
<style>
    /* ============================================
       CALENDARIO UNIFICADO — mismo sistema de diseño
       que el resto del ERP (ver static/css/admin_fix.css:
       fondo oscuro, verde/amarillo QKT, IBM Plex Sans).
       ============================================ */

    .calendario-page {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px;
        font-family: var(--font-principal);
    }

    /* Header */
    .calendario-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
        margin-bottom: 25px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--qkt-border);
    }

    .calendario-header h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
        color: var(--qkt-text-bright);
    }

    /* Leyenda */
    .leyenda-container {
        background: var(--qkt-bg-card);
        border: 1px solid var(--qkt-border-light);
        border-radius: 8px;
        padding: 15px 20px;
        margin-bottom: 20px;
    }

    .leyenda {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
    }

    .leyenda-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--qkt-text);
        font-weight: 500;
    }

    .leyenda-color {
        width: 16px;
        height: 16px;
        border-radius: var(--qkt-badge-radius);
        flex-shrink: 0;
    }

    /* Calendario */
    .calendario-container {
        background: var(--qkt-bg-card);
        border-radius: 8px;
        padding: 20px;
        border: 1px solid var(--qkt-border-light);
    }

    /* FullCalendar — adaptado al tema oscuro */
    .fc {
        font-family: inherit;
        --fc-border-color: var(--qkt-border-light);
        --fc-page-bg-color: transparent;
        --fc-neutral-bg-color: var(--qkt-bg-header);
        --fc-list-event-hover-bg-color: var(--qkt-bg-header);
    }

    .fc .fc-toolbar-title {
        font-size: 1.4em;
        font-weight: 700;
        color: var(--qkt-text-bright);
    }

    .fc-col-header-cell-cushion,
    .fc-list-day-text,
    .fc-list-day-side-text {
        color: var(--qkt-green-text) !important;
    }

    .fc .fc-button {
        background: var(--qkt-bg-header);
        border: 1px solid var(--qkt-border);
        color: var(--qkt-text);
        font-weight: 600;
        padding: 8px 16px;
        border-radius: var(--qkt-btn-radius);
        transition: background-color 0.2s;
        text-transform: none;
    }

    .fc .fc-button:hover {
        background: var(--qkt-border-light);
        border-color: var(--qkt-border);
        color: var(--qkt-text-bright);
    }

    .fc .fc-button-primary:not(:disabled).fc-button-active,
    .fc .fc-button-primary:not(:disabled):active {
        background: var(--qkt-green);
        border-color: var(--qkt-green);
        color: white;
    }

    .fc .fc-daygrid-day-number {
        font-weight: 600;
        color: var(--qkt-text);
        padding: 8px;
    }

    .fc-theme-standard td,
    .fc-theme-standard th {
        border-color: var(--qkt-border-light);
    }

    .fc .fc-daygrid-day.fc-day-today {
        background: rgba(46, 125, 50, 0.15) !important;
    }

    .fc .fc-daygrid-day.fc-day-today .fc-daygrid-day-number {
        background: var(--qkt-green);
        color: white;
        border-radius: 50%;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .fc-daygrid-day-events .fc-daygrid-more-link {
        color: var(--qkt-green-text);
    }

    .fc-event {
        border: none !important;
        border-radius: 4px !important;
        padding: 3px 8px !important;
        font-size: 12px !important;
        font-weight: 600 !important;
        cursor: pointer;
        transition: transform 0.1s, box-shadow 0.1s;
    }

    .fc-event:hover {
        transform: scale(1.02);
        box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }

    .fc-daygrid-event {
        margin: 2px 4px !important;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .calendario-page {
            padding: 10px;
        }

        .calendario-header {
            flex-direction: column;
            align-items: flex-start;
        }

        .calendario-header h1 {
            font-size: 22px;
        }

        .leyenda {
            gap: 10px;
        }

        .leyenda-item {
            font-size: 11px;
        }

        .fc .fc-toolbar {
            flex-direction: column;
            gap: 10px;
        }

        .fc .fc-toolbar-chunk {
            display: flex;
            justify-content: center;
        }

        .fc .fc-toolbar-title {
            font-size: 1.1em;
        }

        .calendario-container {
            padding: 10px;
            border-radius: 8px;
        }
    }

    @media (max-width: 480px) {
        .fc .fc-button {
            padding: 6px 10px;
            font-size: 12px;
        }

        .fc-event {
            font-size: 10px !important;
            padding: 2px 4px !important;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="calendario-page">

    <div class="calendario-header">
        <h1>Calendario unificado</h1>
    </div>

    <div class="leyenda-container">
        <div class="leyenda">
            <div class="leyenda-item">
                <div class="leyenda-color" style="background: #27ae60;"></div>
                Evento Confirmado
            </div>
            <div class="leyenda-item">
                <div class="leyenda-color" style="background: #95a5a6;"></div>
                Evento Borrador
            </div>
            <div class="leyenda-item">
                <div class="leyenda-color" style="background: #9b59b6;"></div>
                Espacio asignado
            </div>
            <div class="leyenda-item">
                <div class="leyenda-color" style="background: #16a085;"></div>
                Personal asignado
            </div>
        </div>
    </div>

    <div class="calendario-container">
        <div id="calendar"></div>
    </div>
</div>

{{ eventos_url|json_script:"eventos-url" }}
<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var eventosUrl = JSON.parse(document.getElementById('eventos-url').textContent);

    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'es',
        height: 'auto',
        firstDay: 1,

        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,listMonth'
        },

        buttonText: {
            today: 'Hoy',
            month: 'Mes',
            week: 'Semana',
            list: 'Lista'
        },

        // Pide solo los eventos del rango visible en cada momento (mes/semana
        // actual, o el que se navegue después) en vez de traer el histórico
        // completo de una sola vez — ver backlog SEC-DOS-001.
        events: function(fetchInfo, successCallback, failureCallback) {
            var url = eventosUrl
                + '?start=' + fetchInfo.startStr.slice(0, 10)
                + '&end=' + fetchInfo.endStr.slice(0, 10);
            fetch(url)
                .then(function(resp) { return resp.json(); })
                .then(successCallback)
                .catch(failureCallback);
        },

        eventClick: function(info) {
            if (info.event.url) {
                window.location.href = info.event.url;
                info.jsEvent.preventDefault();
            }
        },

        eventDidMount: function(info) {
            info.el.title = info.event.title;
        },

        dayMaxEvents: 3,
        moreLinkText: function(num) {
            return '+' + num + ' más';
        }
    });

    calendar.render();
});
</script>
{% endblock %}
