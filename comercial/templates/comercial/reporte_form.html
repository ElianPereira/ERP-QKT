{% extends "admin/base_site.html" %}
{% load static %}

{% block content %}
<div class="qkt-pagina qkt-pagina--angosta">
    <div class="qkt-pagina__cabecera">
        <h1 class="qkt-pagina__titulo"><i class="fas fa-file-pdf" aria-hidden="true"></i> {{ titulo|default:"Generar reporte" }}</h1>
    </div>

    <form method="post" action="" target="_blank" class="qkt-panel">
        <div class="qkt-panel__cuerpo">
            {% csrf_token %}

            <div class="qkt-campo">
                <label for="fecha_inicio">Fecha inicial</label>
                <input type="date" name="fecha_inicio" id="fecha_inicio" class="form-control" required>
            </div>

            <div class="qkt-campo">
                <label for="fecha_fin">Fecha final</label>
                <input type="date" name="fecha_fin" id="fecha_fin" class="form-control" required>
            </div>

            <div class="qkt-campo">
                <label for="estado">Filtrar por estado</label>
                <select name="estado" id="estado" class="form-control">
                    <option value="TODAS">Todos los estados</option>
                    <option value="CONFIRMADA">Confirmadas</option>
                    <option value="BORRADOR">Borradores</option>
                    <option value="CANCELADA">Canceladas</option>
                </select>
            </div>

            <div class="qkt-botonera">
                <button type="submit" class="qkt-btn qkt-btn--primario">Generar documento</button>
                <a href="{% url 'admin:index' %}" class="qkt-btn qkt-btn--secundario">Cancelar</a>
            </div>
        </div>
    </form>
</div>

<script>
    var date = new Date();
    var firstDay = new Date(date.getFullYear(), date.getMonth(), 1);
    var lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0);
    function formatDate(d) {
        let month = '' + (d.getMonth() + 1), day = '' + d.getDate(), year = d.getFullYear();
        if (month.length < 2) month = '0' + month;
        if (day.length < 2) day = '0' + day;
        return [year, month, day].join('-');
    }
    document.getElementById("fecha_inicio").value = formatDate(firstDay);
    document.getElementById("fecha_fin").value = formatDate(lastDay);
</script>
{% endblock %}
